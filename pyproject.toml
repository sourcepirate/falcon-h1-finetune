[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberft"
version = "0.4.0"
description = "QLoRA fine-tuning of Falcon-H1-3B-Instruct on red-team / cyber-security data"
readme = "README.md"
requires-python = ">=3.11"
# Nothing is importable-time mandatory, so `pip install cyberft` stays light; the
# training runtime lives in the `train` extra:  pip install -e ".[train]"
dependencies = []

[project.optional-dependencies]
train = [
  "torch==2.11.0",
  "transformers==5.20.2",
  "peft==0.21.2",
  "bitsandbytes==0.50.2",
  "datasets==5.1.0",
  "accelerate>=1.10,<2",
  "huggingface-hub>=1.31,<3",   # required by transformers 5.20 and datasets 5.1
  "safetensors>=0.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]
# Colab T4: same as `train` minus torch, so pip cannot replace Colab's working
# CUDA build. Pin the pre-installed torch first:
#   python -c "import torch; print(f'torch=={torch.__version__}')" > /tmp/colab-constraints.txt
#   pip install -e ".[colab]" -c /tmp/colab-constraints.txt
colab = [
  "transformers==5.20.2",
  "peft==0.21.2",
  "bitsandbytes==0.50.2",
  "datasets==5.1.0",
  "accelerate>=1.10,<2",
  "huggingface-hub>=1.31,<3",
  "safetensors>=0.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.scripts]
cyberft = "cyberft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberft = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Only a bare `_` is a throwaway: the default pattern exempts every `_private`
# name from F811, so a duplicated module-level helper would pass the gate.
dummy-variable-rgx = "^_$"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
