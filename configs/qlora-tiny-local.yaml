# Local Apple-silicon run (M1/M2 Max, no CUDA). Same corpus and LoRA targets as
# qlora-tiny.yaml; only the device-bound settings differ:
#   * quant: none   -> plain LoRA. bitsandbytes 4-bit is CUDA-only, and
#                      model._load_base raises DependencyError without a GPU.
#   * optim: adamw_torch -> paged_adamw_8bit needs bitsandbytes too.
#   * dtype: auto   -> amp_dtype() resolves to fp32 off-CUDA, so the whole model
#                      runs in one dtype (build_args keeps bf16=False, fp16=False).
# max_steps matches the GPU recipe: at 400 the cosine schedule ends at LR~1e-9
# and the generation gate rejects the adapter as collapsed.
model:
  id: tiiuae/Falcon-H1-Tiny-R-90M
  dtype: auto
  attn: sdpa
  quant: none
  bnb_skip_modules: ["out_proj", "lm_head"]

data:
  output_dir: data/processed
  max_len: 1024
  eval_max_len: 512
  eval_size: 300
  seed: 42
  sources:
    - name: redteam
      repo: WNT3D/Ultimate-Offensive-Red-Team
      parquet: default/train/0000.parquet
      revision: refs/convert/parquet
      cap: 20000
    - name: kali
      repo: suryanshp1/kali-linux-pentesting-data
      cap: 343
    - name: kimi
      repo: echel0nn1881/kimi-cyber-reasoning
      cap: 997
    - name: cti
      repo: reloading0101/threat-intelligence-dataset
      subset: default
      splits: [train, validation]
      cap: 6000
    - name: exploitdb
      repo: Waiper/ExploitDB_DataSet
      parquet: datasets/exploitdb_dataset.parquet
      cap: 8000
    - name: linuxcmd
      repo: Romit2004/LinuxCommands
      cap: 6000
    - name: debian
      repo: 2etatg/Debian_Hacking_Networking
      cap: 965

lora:
  r: 16
  alpha: 16
  dropout: 0.05
  # Never out_proj / conv1d: those bypass the LoRA forward and feed a fused kernel.
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj, gate_proj, up_proj, down_proj]

train:
  output_dir: outputs/falcon-h1-tiny-cyber-local
  micro_batch: 1
  grad_accum: 8
  epochs: 1
  max_steps: 1500    # full recipe: at 400 the cosine schedule ends at LR~1e-9 and the
                     # gate catches a collapsed adapter (repeated -vv)
  lr: 1.0e-4
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  optim: adamw_torch
  # No gradient checkpointing: 91M fp32 is ~364MB, so recomputation buys no
  # memory here, and the extra graph passes are what trip MPS command-buffer
  # hangs on the M2 Max (M1 Max tolerated them; the studio did not).
  gradient_checkpointing: false
  logging_steps: 10
  save_steps: 50      # frequent checkpoints: MPS hangs are not always recoverable
  eval_steps: 100
  save_total_limit: 3
  report_to: []
  num_workers: 0      # forked workers + MPS has hung before; data is cached anyway
  seed: 42
  resume: true
  # Post-train generation gate: finite loss cannot catch mode collapse.
  generation_gate: true
  gate_prompts:
    - "Write a tcpdump command for DNS only"
    - "Explain how SQL injection works."
    - "List three Linux commands to inspect open ports."
  gate_max_new_tokens: 48

export:
  merged_dir: outputs/falcon-h1-tiny-merged-local
  gguf_dir: outputs/gguf-tiny-local
  quant: Q8_0
  llama_cpp_dir: vendor/llama.cpp
  llama_cpp_rev: 9fba51d2c9a1b5cb5f0c47986c031334e2d7663a
  hf_repo: null        # local run: do not publish; use `push` explicitly later

wandb:
  enabled: auto
  project: falcon-h1-cyber
  entity: null
  run_name: null
  tags: [qlora, falcon-h1-tiny, cyber, local-mps]
