name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . --no-deps && pip install -r requirements-dev.txt PyYAML 'datasets>=3'
      - name: lint
        run: ruff check .
      - name: tests (GPU tests skip themselves)
        run: pytest

  types:
    # mypy is only meaningful with the real stubs installed; --no-deps turns
    # transformers/peft/torch into Any and hides genuine type errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[train]" mypy types-PyYAML
      - run: mypy

  resolvable:
    # Catches contradictory version ranges, which an import-coverage test cannot see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --dry-run ".[train]"

  image:
    needs: [check, types, resolvable]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sourcepirate/falcon-h1-tiny:sha-${{ github.sha }}
            ghcr.io/sourcepirate/falcon-h1-tiny:tiny
            ghcr.io/sourcepirate/falcon-h1-tiny:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
